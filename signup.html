<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>ثبت‌نام — ARKA DESIGN</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100;300;400;700;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/auth.css" />
    <link href="assets/css/bootstrap.rtl.min.css" rel="stylesheet" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />
    <link rel="stylesheet" href="assets/css/swiper-bundle.min.css" />
    <link rel="stylesheet" href="assets/css/style.css" />
    <script src="assets/js/auth.js" defer></script>
  </head>
  <body>
    <main class="auth-wrapper position-relative">
       <img
            class="abstract"
            src="./assets/images/login.webp"
            alt=""
          />
      <div class="auth-container">
        <div class="auth-header">
          <div class="brand-logo">
            <a href="/" class="logo">
              <img src="./assets/images/Arka--Logo.png" width="160px" />
            </a>
          </div>
        </div>

        <form id="signup-form" novalidate>
          <div class="field">
            <label for="signup-name">نام و نام خانوادگی</label>
            <input
              id="signup-name"
              type="text"
              placeholder="نام کامل شما"
              minlength="2"
              maxlength="40"
              required
              autocomplete="name"
            />
          </div>

          <div class="field">
            <label for="signup-email">ایمیل</label>
            <input
              id="signup-email"
              type="email"
              placeholder="you@example.com"
              maxlength="50"
              required
              autocomplete="email"
            />
          </div>

          <div class="field">
            <label for="signup-phone">شماره موبایل</label>
            <input
              id="signup-phone"
              type="tel"
              placeholder="09xxxxxxxxx"
              pattern="^09\d{9}$"
              maxlength="11"
              required
              autocomplete="tel"
            />
          </div>

          <div class="field">
            <label for="signup-password">رمز عبور</label>
            <input
              id="signup-password"
              type="password"
              placeholder="حداقل ۸ کاراکتر"
              minlength="8"
              maxlength="64"
              required
              autocomplete="new-password"
            />
            <!-- <div id="pw-meter" class="pw-meter"><i></i></div> -->
          </div>

          <div class="field">
            <label for="signup-password-confirm">تکرار رمز عبور</label>
            <input
              id="signup-password-confirm"
              type="password"
              placeholder="رمز عبور را تکرار کنید"
              minlength="8"
              maxlength="64"
              required
              autocomplete="new-password"
            />
          </div>

          <div id="signup-error" class="error"></div>

          <button class="auth-btn" type="submit" style="margin-top: 24px">
            ساخت حساب
          </button>

          <p class="note">
            قبلاً ثبت‌نام کرده‌اید؟
            <a href="login.html" class="link">وارد شوید</a>
          </p>
          <p
            class="note"
            style="font-size: 12px; color: #ccc; margin-top: 16px"
          >
            با ثبت‌نام، <a href="#" class="link">شرایط استفاده</a> و
            <a href="#" class="link">حریم خصوصی</a> ما را می‌پذیرید.
          </p>
        </form>
      </div>
    </main>
    <script src="assets/js/bootstrap.boundle.js"></script>
    <script src="assets/js/swiper-bundle.min.js"></script>
    <script src="assets/js/jalaali.min.js"></script>
    <script src="assets/js/lucide.min.js"></script>
    <script src="assets/js/auth.js"></script>
  </body>
</html>
