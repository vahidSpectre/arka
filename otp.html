<!doctype html>
<html lang="fa">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>تأیید — ARKA DESIGN</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100;300;400;700;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/auth.css" />
    <link rel="stylesheet" href="assets/css/bootstrap.rtl.min.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />
    <link rel="stylesheet" href="assets/css/swiper-bundle.min.css" />
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body>
    <main class="auth-wrapper position-relative">
       <img
            class="abstract"
            src="./assets/images/login.webp"
            alt=""
          />
      <div class="auth-container">
        <div class="auth-header">
          <div class="brand-logo"> <a href="/" class="logo">
              <img src="./assets/images/Arka--Logo.png" width="120px" />
            </a></div>
          <h1>تأیید هویت</h1>
          <p class="subtitle">کد ۶ رقمی ارسال شده به شما را وارد کنید</p>
        </div>

        <form id="otp-form" novalidate>
          <div class="field">
            <label style="margin-bottom: 16px" class="mx-auto">کد تأیید</label>
            <div class="otp-inputs">
              <input
                class="otp-input"
                type="text"
                inputmode="numeric"
                maxlength="1"
                pattern="[0-9]"
                required
                aria-label="رقم اول کد"
              />
              <input
                class="otp-input"
                type="text"
                inputmode="numeric"
                maxlength="1"
                pattern="[0-9]"
                required
                aria-label="رقم دوم کد"
              />
              <input
                class="otp-input"
                type="text"
                inputmode="numeric"
                maxlength="1"
                pattern="[0-9]"
                required
                aria-label="رقم سوم کد"
              />
              <input
                class="otp-input"
                type="text"
                inputmode="numeric"
                maxlength="1"
                pattern="[0-9]"
                required
                aria-label="رقم چهارم کد"
              />
              <input
                class="otp-input"
                type="text"
                inputmode="numeric"
                maxlength="1"
                pattern="[0-9]"
                required
                aria-label="رقم پنجم کد"
              />
              <input
                class="otp-input"
                type="text"
                inputmode="numeric"
                maxlength="1"
                pattern="[0-9]"
                required
                aria-label="رقم ششم کد"
              />
            </div>
          </div>

          <div id="otp-error" class="error center"></div>

          <button class="auth-btn" type="submit" style="margin-top: 24px">
            تأیید
          </button>

          <p class="note" style="margin-top: 16px">کد را دریافت نکردید؟</p>
          <button
            id="resend-btn"
            type="button"
            class="auth-btn-outline"
            style="width: 100%; margin-top: 8px"
          >
            ارسال مجدد
          </button>

          <p class="note" style="margin-top: 20px">
            <a href="login.html" class="link">← بازگشت به ورود</a>
          </p>
        </form>
      </div>
    </main>
    <script src="assets/js/auth.js" defer></script>
    <script src="assets/js/bootstrap.boundle.js"></script>
    <script src="assets/js/swiper-bundle.min.js"></script>
    <script src="assets/js/jalaali.min.js"></script>
    <script src="assets/js/lucide.min.js"></script>
  </body>
</html>
